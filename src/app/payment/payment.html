<div class="section-header">
  <div><h2>Payments</h2></div>
  <input type="text" [(ngModel)]="searchQuery" (input)="filterData()" placeholder="Search..." style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
</div>

<div *ngIf="errorMessage" style="color: red; padding: 10px; background: #fee;">{{ errorMessage }}</div>
<div *ngIf="successMessage" style="color: green; padding: 10px; background: #efe;">{{ successMessage }}</div>

<section class="add-form" style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
  <h2>{{ isEditing ? 'Edit' : 'Add New' }} Payment</h2>
  <div class="form-row" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
    <div class="form-group"><label>paymentId</label><input type="text" [(ngModel)]="currentItem.paymentId" [disabled]="isEditing"></div>
    <div class="form-group"><label>Rental</label><select [(ngModel)]="currentItem.rentalId"><option *ngFor="let r of rentals" [value]="r.rentalId">{{r.rentalId}}</option></select></div>
    <div class="form-group"><label>amount</label><input type="number" [(ngModel)]="currentItem.amount" ></div>
    <div class="form-group"><label>paymentDate</label><input type="date" [(ngModel)]="currentItem.paymentDate" ></div>
    <button class="add-button" (click)="saveItem()" [disabled]="isLoading" style="padding: 10px 15px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer;">{{ isEditing ? 'Update' : '+ Add' }}</button>
    <button *ngIf="isEditing" (click)="resetForm()" style="padding: 10px 15px; background: #9ca3af; color: white; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
  </div>
</section>

<div class="table-container">
  <div *ngIf="isLoading" style="padding: 20px;">Loading...</div>
  
  <table *ngIf="!isLoading" style="width: 100%; text-align: left; background: white;">
    <thead style="background: #f8fafc;">
      <tr><th>paymentId</th><th>rentalId</th><th>amount</th><th>paymentDate</th><th>Actions</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of filteredItems" style="border-bottom: 1px solid #eee;">
        <td>{{ item.paymentId }}</td>
        <td>{{ item.rentalId }}</td>
        <td>{{ item.amount }}</td>
        <td>{{ item.paymentDate }}</td>
        <td>
          <button class="edit-btn" (click)="editItem(item)" style="margin-right: 5px; padding: 5px 10px; background: #fbbf24; border: none; border-radius: 3px; cursor: pointer;">Edit</button>
          <button class="delete-btn" (click)="deleteItem(item.paymentId)" style="padding: 5px 10px; background: #ef4444; color: white; border: none; border-radius: 3px; cursor: pointer;">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!isLoading && filteredItems.length === 0" style="padding: 20px; text-align: center; color: #666;">
    <p>No payments found.</p>
    <p>No payments have been registered yet.</p>
  </div>
</div>
